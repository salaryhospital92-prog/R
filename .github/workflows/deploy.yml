name: نشر المتجر على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # إعادة بناء دورية لتوليد صفحات المنتجات المضافة حديثاً
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # صفحة 404 نسخة من index.html ليعمل التوجيه الداخلي عند فتح رابط مباشر
      - run: cp dist/index.html dist/404.html
      # يمنع GitHub Pages من تجاهل الملفات التي تبدأ بشرطة سفلية
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
